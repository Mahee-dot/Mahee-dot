<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" width="128" height="112" role="img" shape-rendering="crispEdges">
  <title>Tiny pixel-art robot companion</title>
  <style>
    .eyes { animation: blink 5s infinite; }
    .ant  { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,90%,100% { opacity: 1 } 94% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .eyes, .ant { animation: none; } }
  </style>
  <!-- antenna -->
  <rect class="ant" x="56" y="0" width="16" height="8" fill="#7EE787"/>
  <rect x="56" y="8" width="16" height="8" fill="#A89BD6"/>
  <!-- head -->
  <rect x="24" y="16" width="80" height="56" fill="#4B3F72"/>
  <rect x="24" y="16" width="80" height="8" fill="#A89BD6"/>
  <rect x="24" y="64" width="80" height="8" fill="#A89BD6"/>
  <rect x="24" y="16" width="8" height="56" fill="#A89BD6"/>
  <rect x="96" y="16" width="8" height="56" fill="#A89BD6"/>
  <!-- screen, eyes, mouth -->
  <rect x="40" y="32" width="48" height="24" fill="#0D1117"/>
  <g class="eyes" fill="#56D4DD">
    <rect x="48" y="40" width="8" height="8"/>
    <rect x="72" y="40" width="8" height="8"/>
  </g>
  <rect x="56" y="48" width="16" height="8" fill="#7EE787"/>
  <!-- body -->
  <rect x="32" y="72" width="64" height="24" fill="#4B3F72"/>
  <rect x="32" y="72" width="8" height="24" fill="#A89BD6"/>
  <rect x="88" y="72" width="8" height="24" fill="#A89BD6"/>
  <rect x="32" y="96" width="64" height="8" fill="#A89BD6"/>
  <rect x="48" y="80" width="8" height="8" fill="#7EE787"/>
  <rect x="72" y="80" width="8" height="8" fill="#56D4DD"/>
  <!-- arms and feet -->
  <rect x="24" y="72" width="8" height="16" fill="#A89BD6"/>
  <rect x="96" y="72" width="8" height="16" fill="#A89BD6"/>
  <rect x="40" y="104" width="16" height="8" fill="#A89BD6"/>
  <rect x="72" y="104" width="16" height="8" fill="#A89BD6"/>
</svg>
