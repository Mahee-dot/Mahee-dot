
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 112"
     width="128" height="112"
     role="img"
     shape-rendering="crispEdges">

  <title>Tiny pixel-art hamster companion</title>

  <style>
    .eyes {
      animation: blink 5s infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .cheeks {
      animation: breathe 3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      94%, 97% { opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyes, .cheeks { animation: none; }
    }
  </style>

  <!-- Tiny ears -->
  <g id="ears">
    <rect x="24" y="16" width="16" height="16" fill="#BDA68E"/>
    <rect x="28" y="20" width="8" height="8" fill="#D99BA6"/>

    <rect x="88" y="16" width="16" height="16" fill="#BDA68E"/>
    <rect x="92" y="20" width="8" height="8" fill="#D99BA6"/>
  </g>

  <!-- Fluffy hamster silhouette -->
  <g id="body">
    <rect x="32" y="24" width="64" height="8" fill="#BDA68E"/>
    <rect x="24" y="32" width="80" height="40" fill="#E8D7BF"/>
    <rect x="32" y="72" width="64" height="16" fill="#E8D7BF"/>

    <!-- Lavender fur patches -->
    <rect x="32" y="32" width="16" height="16" fill="#A89BD6"/>
    <rect x="40" y="24" width="16" height="8" fill="#A89BD6"/>
    <rect x="80" y="32" width="16" height="16" fill="#A89BD6"/>
    <rect x="72" y="24" width="16" height="8" fill="#A89BD6"/>

    <!-- Lower fur -->
    <rect x="40" y="80" width="16" height="8" fill="#D6BFA4"/>
    <rect x="72" y="80" width="16" height="8" fill="#D6BFA4"/>
  </g>

  <!-- Face -->
  <g class="eyes" fill="#292632">
    <rect x="44" y="44" width="8" height="8"/>
    <rect x="76" y="44" width="8" height="8"/>
  </g>

  <!-- Tiny eye highlights -->
  <g fill="#FFF8ED">
    <rect x="44" y="44" width="4" height="4"/>
    <rect x="76" y="44" width="4" height="4"/>
  </g>

  <!-- Pink nose -->
  <rect x="60" y="52" width="8" height="4" fill="#D99BA6"/>
  <rect x="56" y="56" width="16" height="4" fill="#B87588"/>

  <!-- Blushing cheeks -->
  <g class="cheeks" fill="#E9A8B3">
    <rect x="32" y="52" width="12" height="8"/>
    <rect x="84" y="52" width="12" height="8"/>
  </g>

  <!-- Whiskers -->
  <g fill="#8F7C70">
    <rect x="16" y="52" width="16" height="2"/>
    <rect x="20" y="60" width="12" height="2"/>
    <rect x="96" y="52" width="16" height="2"/>
    <rect x="96" y="60" width="12" height="2"/>
  </g>

  <!-- Little paws -->
  <g fill="#E8D7BF">
    <rect x="36" y="76" width="16" height="8"/>
    <rect x="76" y="76" width="16" height="8"/>
  </g>

  <!-- Feet -->
  <g fill="#D99BA6">
    <rect x="36" y="88" width="20" height="8"/>
    <rect x="72" y="88" width="20" height="8"/>
  </g>

  <!-- Tiny sage-green accessory -->
  <g fill="#7DA58A">
    <rect x="56" y="12" width="8" height="8"/>
    <rect x="48" y="16" width="8" height="8"/>
    <rect x="64" y="16" width="8" height="8"/>
  </g>

</svg>
